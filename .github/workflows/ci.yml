name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: License check
        run: |
          if [ -f "LICENSE" ]; then
            echo "[OK] LICENSE present"
          else
            echo "[NO] LICENSE missing" && exit 1
          fi

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run tests (vitest)
        run: |
          # 真实运行桌面前端单元测试（vitest run 非监听模式，CI 下不会挂起）。
          # 注意：package.json 的 `npm run test` 是 vitest 监听模式，CI 请使用
          # `test:run`（vitest run），任何失败都会使 job 失败。
          npm run test:run
